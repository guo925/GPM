server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import: optional:file:./application-local.yml

  output:
    ansi:
      enabled: always
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/graduation?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5s

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms

mybatis-plus:

  # Mapper XML路径
  mapper-locations: classpath*:mapper/**/*.xml

  # 实体类别名扫描
  type-aliases-package: com.gjx.gpms.*.entity

  configuration:

    # 控制台SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:

      # 逻辑删除字段
      logic-delete-field: isDeleted

      # 已删除
      logic-delete-value: 1

      # 未删除
      logic-not-delete-value: 0

logging:
  level:

    # 项目日志级别
    com.gjx.gpms: debug

# =========================
# 文件存储（oss 或 local）
# =========================
file:
  storage:
    type: ${FILE_STORAGE_TYPE:oss}
    local-path: ./uploads
    local-url-prefix: /uploads

# =========================
# 阿里云 OSS
# =========================
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket-name: gpmss
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
